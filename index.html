
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Technologies Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>Web Technologies Project</h2>
        <nav>
            <a href="#home">Home</a>
            <a href="#login">Login</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="home">
        <h1>Welcome to Our Website</h1>
        <p>This project demonstrates web development
        and GitHub collaboration.</p>
    </section>

    <section id="login">
        <h2>Login Form</h2>
        <input type="text" id="username"
               placeholder="Enter username">
        <button onclick="login()">Login</button>
        <p id="message"></p>
    </section>

    <section id="contact">
        <h2>Contact Us</h2>
        <p>Email: team@example.com</p>
    </section>

    <script src="script.js"></script>
</body>
</html>
